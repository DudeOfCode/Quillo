<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Writer – Document Editor</title>

<style>
:root{--bg:#eef1f6;--bar:#ffffff;--panel:#f6f8fc;--ink:#1f2430;--muted:#6b7280;--line:#dce1ea;--acc:#2f6fed;--hov:#eef3ff;--active:#dfe8ff;--sh:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--bar:#171b22;--panel:#1c212a;--ink:#e6e8ee;--muted:#94a0b3;--line:#2b323d;--hov:#222b3a;--active:#26344d}}
:root[data-theme="dark"]{--bg:#0f1216;--bar:#171b22;--panel:#1c212a;--ink:#e6e8ee;--muted:#94a0b3;--line:#2b323d;--hov:#222b3a;--active:#26344d}
:root[data-theme="light"]{--bg:#eef1f6;--bar:#ffffff;--panel:#f6f8fc;--ink:#1f2430;--muted:#6b7280;--line:#dce1ea;--hov:#eef3ff;--active:#dfe8ff}
*{box-sizing:border-box}
html{height:100%}body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,.btn{font:inherit;color:inherit}
select,input[type=text],input[type=number]{background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
input[type=number]{width:56px;cursor:text}
input[type=color]{padding:0;width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
/* icon toolbar buttons */
#ribbon button,#top button,#top .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 9px;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,transform .04s;font-weight:600}
#ribbon button:hover,#top button:hover,#top .btn:hover{background:var(--hov)}
#ribbon button:active,#top button:active,#top .btn:active{transform:translateY(1px)}
#ribbon button svg,#top button svg,#top .btn svg,#tabs button svg,#st svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ribbon button.on{background:var(--active);border-color:var(--acc);color:var(--acc)}
.pri{background:var(--acc)!important;color:#fff!important}.pri:hover{filter:brightness(1.07)}.pri svg{stroke:#fff}
button:disabled{opacity:.4;cursor:default}
/* top app bar */
#top{display:flex;gap:5px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap;box-shadow:var(--sh);z-index:3}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--acc);margin-right:2px;letter-spacing:.2px}
.brand svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#title{cursor:text;min-width:110px;flex:1;max-width:340px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px}
#title:hover{border-color:var(--line)}#title:focus{border-color:var(--acc);background:var(--bar);outline:none}
.sp{flex:1}.dv{width:1px;height:24px;background:var(--line);margin:0 4px}
/* tabs */
#tabs{display:flex;gap:4px;background:var(--bar);padding:5px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;position:relative}
#tabs button:hover{background:var(--hov);color:var(--ink)}
#tabs .on{color:var(--acc)}
#tabs .on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
/* ribbon */
#ribbon{background:var(--bar);border-bottom:1px solid var(--line);padding:9px 10px;max-height:38vh;overflow-y:auto}#ribbon.collapsed{display:none}
.grp{flex-wrap:wrap;max-width:100%}.fold{height:36px;min-width:120px;max-width:100%}#p-tbl .grp:first-child{display:none}
.p{display:none;flex-wrap:wrap;gap:8px;align-items:center}.p.on{display:flex}
.grp{display:inline-flex;align-items:center;gap:3px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.grp .lb{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 6px 0 4px}
.p i{width:1px;height:24px;background:var(--line);margin:0 2px}.p small{opacity:.8;color:var(--muted);padding:0 3px}
#wrap{flex:1;overflow:auto;padding:14px 8px;touch-action:pan-x pan-y}#zoomer{width:max-content;margin:0 auto}
#paper{position:relative;background:#fff;color:#000;box-shadow:0 2px 14px #0004}
#ed{box-sizing:border-box;width:100%;padding:96px;outline:none;font:15px/1.4 Calibri,Carlito,Arial,sans-serif}
#ed p,#ed div{margin:0;padding-bottom:8px}#ed h1,#ed h2,#ed h3,#ed ul,#ed ol{margin:0;padding-bottom:8px}#ed ul,#ed ol{padding-left:30px}
#ed h1{font-size:28px}#ed h2{font-size:22px}#ed h3{font-size:18px}#ed img{max-width:100%}
#ed table{border-collapse:collapse;margin:0}#ed table+p,#ed table+div{padding-top:8px}
#ed td,#ed th{border:1px solid #000;padding:4px 6px;vertical-align:top;min-width:20px}
#ed .sel{outline:2px solid #2f6fed;outline-offset:-2px;background-image:linear-gradient(#2f6fed38,#2f6fed38)}
.sb{display:flex;justify-content:space-between;border-top:2px dashed #2f6fed;color:#2f6fed;font:11px sans-serif;padding:2px 0!important;user-select:none}.sb .x{cursor:pointer;font-style:normal}
.pl{position:absolute;left:0;right:0;height:12px;background:var(--bg);pointer-events:none}.pf{position:absolute;left:96px;right:96px;font:13px Calibri,Arial,sans-serif;pointer-events:none;color:#000}
.exporting .pl,.exporting .sb{visibility:hidden}.exporting .sel{outline:0;background-image:none}
#tov{position:absolute;left:0;top:0;width:0;height:0}
.th{position:absolute;box-sizing:border-box;background:#f4f6fa;color:#222;border:1px solid #888;border-radius:4px;text-align:center;font:12px sans-serif;cursor:pointer;user-select:none;overflow:hidden}
.th:hover{background:#dbe6fd}.th.c,.th.a{color:#2f6fed;font-weight:700;border-radius:50%;border-color:#2f6fed}.th.a{font-size:17px}
.exporting #tov{display:none}button:disabled{opacity:.4;cursor:default}
#st{padding:7px 14px;background:var(--bar);border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);box-shadow:0 -1px 2px rgba(20,30,60,.05)}
#st span{display:inline-flex;align-items:center;gap:5px}#st .sp{flex:1}#st svg{width:14px;height:14px}#st select{padding:3px 7px}#st label{display:inline-flex;align-items:center;gap:6px}
#toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:11px;display:none;z-index:9;box-shadow:0 12px 34px rgba(0,0,0,.4);font-weight:500;max-width:80vw;text-align:center}
</style></head><body>

<div class="grp"><span class="lb">Paragraph</span>
<select id="blk"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select><button data-c="removeFormat" title="Clear formatting"><svg viewBox="0 0 24 24"><path d="M7 7V5h12M11 5 8 19M14 13l6 6M20 13l-6 6"/></svg></button></div>
</div>
<div class="p" id="p-ins">
<div class="grp"><span class="lb">Table</span><input type="number" id="tr" value="3" min="1" max="30" title="Rows"> <small>×</small> <input type="number" id="tc" value="3" min="1" max="12" title="Columns"><button id="iTbl" title="Insert table"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 4v16"/></svg>Insert</button></div>
<div class="grp"><span class="lb">Media</span><button id="iImg" title="Insert image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></button><input type="file" id="fImg" accept="image/*" hidden><button id="iLnk" title="Insert link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg></button><button data-c="insertHorizontalRule" title="Horizontal line"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg></button></div>
<div class="grp"><span class="lb">Layout</span><button id="iSec" title="Insert section break (starts a new page)"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h16"/><path d="M4 15h16M4 19h16" stroke-dasharray="3 3"/><path d="M12 11v2"/></svg>Section break</button></div>
</div>
<div class="p" id="p-tbl">

<div class="grp"><span class="lb">Borders</span><select id="bs"><option>solid</option><option>dashed</option><option>dotted</option><option>double</option></select><select id="bw" title="Width"><option>1</option><option>2</option><option>3</option><option>4</option></select><input type="color" id="bc" title="Border colour" value="#000000"><button data-b="all">All</button><button data-b="outer">Outside</button><button data-b="top">Top</button><button data-b="bottom">Bottom</button><button data-b="left">Left</button><button data-b="right">Right</button><button data-b="none">None</button></div>

</div>

<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),ed=$('#ed'),paper=$('#paper'),M=96;
let land=false,saved=null,lastCell=null,curSec=0,z=1,cfg0={fmt:'dec',start:'1',align:'center'},sbP=[];
const dim=()=>land?[1123,794]:[794,1123];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)};
const rom=n=>{let r='';[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,s])=>{while(n>=v){r+=s;n-=v}});return r};
const fmtN=(n,f)=>f=='dec'?n:f=='rl'?rom(n).toLowerCase():f=='ru'?rom(n):'';
const sbs=()=>[...ed.querySelectorAll(':scope>.sb')];
const getCfg=i=>i==0?cfg0:sbs()[i-1].dataset;
/* ---------- layout / pagination ---------- */
let raf;const sync=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(layout)};
function layout(){
 const [W,H]=dim(),us=H-2*M;paper.style.width=W+'px';ed.style.minHeight='';
 const kids=[...ed.children];kids.forEach(b=>b.style.marginTop='');
 let force=false,fp=0;sbP=[];
 for(const b of kids){
  const t=b.offsetTop,h=b.offsetHeight,p=Math.floor(t/H),st=p*H+M,en=(p+1)*H-M;let sh=0;
  if(force){sh=(fp+1)*H+M-t;force=false}
  else if(t<st)sh=st-t;
  else if(h<=us&&t>st&&t+h>en)sh=(p+1)*H+M-t;
  if(sh>0)b.style.marginTop=sh+'px';
  if(b.classList.contains('sb')){fp=Math.floor(b.offsetTop/H);sbP.push(fp);force=true}
 }
 const l=ed.lastElementChild,bt=l?l.offsetTop+l.offsetHeight+M:H,pages=Math.max(1,Math.ceil(bt/H));
 ed.style.minHeight=pages*H+'px';
 paper.querySelectorAll('.pf,.pl').forEach(e=>e.remove());
 let n=0,prev=-1;
 for(let p=0;p<pages;p++){
  const s=sbP.filter(x=>x<p).length,c=getCfg(s);
  if(s!==prev){n=(c.start!==''&&c.start!=null)?parseInt(c.start)||0:(s==0?1:n+1);prev=s}else n++;
  const f=document.createElement('div');f.className='pf';f.style.top=((p+1)*H-M/2-8)+'px';f.style.textAlign=c.align;f.textContent=fmtN(n,c.fmt);paper.appendChild(f);
  if(p<pages-1){const d=document.createElement('div');d.className='pl';d.style.top=((p+1)*H-6)+'px';paper.appendChild(d)}
 }
 paper.dataset.pages=pages;status();persist();
}
function curBlock(){const s=getSelection();let n=s.anchorNode;if(!n||!ed.contains(n))return null;while(n.parentNode!==ed)n=n.parentNode;return n}
function secIdx(){let n=saved&&saved.startContainer;if(!n||n===ed||!ed.contains(n))return 0;while(n.parentNode!==ed)n=n.parentNode;return sbs().filter(x=>x.compareDocumentPosition(n)&4).length}
function status(){
 const [W,H]=dim(),i=secIdx();let pg=1;
 if(saved){const r=saved.getBoundingClientRect(),pr=paper.getBoundingClientRect();if(r.top||r.height)pg=Math.max(1,Math.min(+paper.dataset.pages,Math.floor((r.top-pr.top)/z/H)+1))}
 $('#sp').textContent=`Page ${pg} of ${paper.dataset.pages}`;$('#ss').textContent='Section '+(i+1);
 $('#sw').textContent=(ed.innerText.trim().split(/\s+/).filter(Boolean).length)+' words';

 w.addEventListener('touchmove',e=>{if(e.touches.length==2&&d0){e.preventDefault();const nz=Math.max(.3,Math.min(3,z0*dist(e.touches)/d0)),k=nz/z0;setZ(nz);w.scrollLeft=(sl+cx)*k-cx;w.scrollTop=(st+cy)*k-cy;
  const o=$('#zm');let c=o.querySelector('#zc');if(!c){c=new Option('','0');c.id='zc';o.add(c,0)}c.value=nz;c.textContent=Math.round(nz*100)+'%';o.value=String(nz)}},{passive:false});
 w.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0})})();
